<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<title>Controller · Pocket Shelf</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg: #0b0b0e; --pad: #2a2a33; --pad-hi: #ffcb3d; --text: #ecebf2; --muted: #8d8c9a; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; touch-action: none;
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  .wrap { position: fixed; inset: 0; padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto 1fr auto; gap: 8px; }
  .status { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; }
  .dot.ok { background: #47d18c; } .dot.bad { background: #ff6b6b; }
  .shoulders { grid-column: 1 / -1; display: none; }
  .left, .right { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; min-width: 0; }
  .mid { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 14px; padding-bottom: 6px; }
  .shoulder { width: min(150px, 38vw); height: 46px; border-radius: 14px; }
  .btn { background: var(--pad); border: 1px solid #3a3a46; color: var(--text); font-weight: 800; display: grid; place-items: center; border-radius: 50%; transition: transform .05s, background .05s; }
  .btn.on { background: var(--pad-hi); color: #1a1500; transform: scale(.94); }
  .btn.shoulder { border-radius: 14px; font-size: 18px; } .btn.pill { border-radius: 999px; }
  .face { position: relative; width: min(230px, 42vw); height: min(230px, 42vw); }
  .face .btn { position: absolute; width: 42%; height: 42%; font-size: clamp(22px, 6vw, 34px); }
  .face .a { right: 0; top: 18%; } .face .b { left: 14%; bottom: 0; }
  .face .x { right: 30%; top: -14%; width: 30%; height: 30%; font-size: 18px; } .face .y { left: -6%; top: 22%; width: 30%; height: 30%; font-size: 18px; }
  .face:not(.ds) .x, .face:not(.ds) .y { display: none; }
  .pill { border-radius: 999px; width: 92px; height: 38px; font-size: 13px; font-weight: 700; }
  .dpad { position: relative; width: min(250px, 44vw); height: min(250px, 44vw); touch-action: none; }
  .dpad .arm { position: absolute; background: var(--pad); border: 1px solid #3a3a46; }
  .dpad .h { left: 0; right: 0; top: 33%; height: 34%; border-radius: 14px; }
  .dpad .v { top: 0; bottom: 0; left: 33%; width: 34%; border-radius: 14px; }
  .dpad .dir { position: absolute; width: 34%; height: 34%; display: grid; place-items: center; color: #777; font-size: 22px; pointer-events: none; }
  .dpad .dir.on { color: var(--pad-hi); }
  .dpad .up { left: 33%; top: 0; } .dpad .down { left: 33%; bottom: 0; } .dpad .left { left: 0; top: 33%; } .dpad .right { right: 0; top: 33%; }
  .hint { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: rgba(11,11,14,.94); z-index: 5; }
  .hint.hide { display: none; }
  .hint button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 22px; background: var(--pad-hi); color: #1a1500; font-weight: 800; font-size: 16px; }
  @media (orientation: portrait) {
    .wrap { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto; }
    .shoulders { display: flex; justify-content: space-between; }
    .left .shoulder, .right .shoulder { display: none; }
    .mid { grid-column: 1 / -1; grid-row: 4; flex-direction: row; justify-content: center; }
    .dpad { width: 46vw; height: 46vw; } .face { width: 42vw; height: 42vw; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  <div class="shoulders"><div class="btn shoulder" data-b="L">L</div><div class="btn shoulder" data-b="R">R</div></div>
  <div class="left">
    <div class="btn shoulder" data-b="L">L</div>
    <div class="dpad" id="dpad">
      <div class="arm h"></div><div class="arm v"></div>
      <div class="dir up">▲</div><div class="dir down">▼</div><div class="dir left">◀</div><div class="dir right">▶</div>
    </div>
  </div>
  <div class="mid">
    <div class="btn pill" data-b="SELECT">Select</div>
    <div class="btn pill" data-b="START">Start</div>
  </div>
  <div class="right">
    <div class="btn shoulder" data-b="R">R</div>
    <div class="face" id="face">
      <div class="btn x" data-b="X">X</div><div class="btn y" data-b="Y">Y</div>
      <div class="btn a" data-b="A">A</div><div class="btn b" data-b="B">B</div>
    </div>
  </div>
</div>
<div class="hint" id="hint"><div>
  <div id="hintText" style="font-size:17px">Turn your phone sideways for the best grip.</div>
  <button id="goBtn">Start controller</button>
</div></div>

<script src="peerjs.min.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const hostId = decodeURIComponent(location.hash.slice(1));
  let conn = null, title = "";
  const held = new Set();
  const capture = (el, id) => { try { el.setPointerCapture(id); } catch (e) {} };

  function status(text, state) {
    $("#status").textContent = text;
    $("#dot").className = "dot" + (state === "ok" ? " ok" : state === "bad" ? " bad" : "");
  }
  function send(b, v) {
    if (v) { if (held.has(b)) return; held.add(b); } else { if (!held.has(b)) return; held.delete(b); }
    if (v && navigator.vibrate) navigator.vibrate(8);
    if (conn && conn.open) conn.send({ b, v: v ? 1 : 0 });
  }

  // ----- buttons (multi-touch) -----
  document.querySelectorAll("[data-b]").forEach(el => {
    const b = el.dataset.b;
    const down = (e) => { e.preventDefault(); capture(el, e.pointerId); el.classList.add("on"); send(b, true); };
    const up = (e) => { el.classList.remove("on"); send(b, false); };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("lostpointercapture", up);
  });

  // ----- D-pad: 4-way, slide between directions -----
  const dpad = $("#dpad");
  let dpadPointer = null, current = null;
  function setDir(dir) {
    if (dir === current) return;
    if (current) { send(current, false); dpad.querySelector("." + current.toLowerCase()).classList.remove("on"); }
    current = dir;
    if (dir) { send(dir, true); dpad.querySelector("." + dir.toLowerCase()).classList.add("on"); }
  }
  function dirFrom(e) {
    const r = dpad.getBoundingClientRect();
    const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(x, y) < r.width * 0.09) return null;          // small dead zone in the centre
    return Math.abs(x) > Math.abs(y) ? (x > 0 ? "RIGHT" : "LEFT") : (y > 0 ? "DOWN" : "UP");
  }
  dpad.addEventListener("pointerdown", (e) => { e.preventDefault(); dpadPointer = e.pointerId; capture(dpad, e.pointerId); setDir(dirFrom(e)); });
  dpad.addEventListener("pointermove", (e) => { if (e.pointerId === dpadPointer) setDir(dirFrom(e)); });
  const dEnd = (e) => { if (e.pointerId === dpadPointer) { dpadPointer = null; setDir(null); } };
  dpad.addEventListener("pointerup", dEnd); dpad.addEventListener("pointercancel", dEnd); dpad.addEventListener("lostpointercapture", dEnd);

  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ----- full screen, landscape, screen awake -----
  let wake = null;
  async function goFull() {
    $("#hint").classList.add("hide");
    try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
    try { await screen.orientation.lock("landscape"); } catch (e) {}
    try { wake = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  $("#goBtn").onclick = goFull;
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && $("#hint").classList.contains("hide")) { try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
    if (document.visibilityState === "hidden") [...held].forEach(b => send(b, false));
  });

  // ----- connection -----
  if (!hostId) { status("No game to connect to. Scan the QR code on your laptop again.", "bad"); return; }
  if (typeof Peer === "undefined") { status("Couldn't load the connection library. Check your internet.", "bad"); return; }
  let tries = 0;
  const peer = new Peer();
  peer.on("open", connect);
  peer.on("error", (err) => {
    status(err.type === "peer-unavailable" ? "Game not found. Is it still open on the laptop?" : "Connection problem: " + (err.type || err.message), "bad");
    if (++tries < 4) setTimeout(connect, 2500);
  });
  function connect() {
    status("Connecting to your game…");
    conn = peer.connect(hostId, { reliable: true });
    conn.on("open", () => status(title ? "Connected · " + title : "Connected", "ok"));
    conn.on("data", (msg) => {
      if (msg && msg.hello) {
        title = msg.title || ""; status("Connected · " + title, "ok");
        $("#face").classList.toggle("ds", msg.system === "nds");
      }
    });
    conn.on("close", () => { status("Disconnected. Scan the QR code again to reconnect.", "bad"); held.clear(); });
  }
})();
</script>
</body>
</html>
