<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121216">
<title>Pocket Shelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt="">Pocket Shelf</div>
  <div class="spacer"></div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">Preparing offline mode…</span></div>
</header>

<main id="main">
  <div id="continueWrap"></div>
  <div id="libWrap"></div>
  <p class="foot">Your ROMs and saves never leave this device. No account, no servers.<br>
    Emulation by <a href="LICENSE-EmulatorJS.txt">EmulatorJS</a> (mGBA, melonDS, DeSmuME cores, GPL).</p>
</main>

<button class="btn primary fab" id="addBtn">＋ Add ROMs</button>
<input type="file" id="fileIn" multiple accept=".gba,.gb,.gbc,.sgb,.nds,.zip" hidden>
<input type="file" id="saveIn" accept=".sav,.srm,.dsv" hidden>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="lib.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let games = [];

function toast(msg, ms = 2600) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function mono(title) {
  const t = title.replace(/^Pokémon\s+/i, "");
  const words = t.split(/\s+/).filter(Boolean);
  return words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : t.slice(0, 2).toUpperCase();
}

async function render() {
  games = (await Store.allGames()).sort((a, b) => (b.lastPlayed - a.lastPlayed) || a.title.localeCompare(b.title));
  const last = games.find(g => g.lastPlayed);
  $("#continueWrap").innerHTML = last ? `
    <h2 class="section">Continue</h2>
    <button class="continue" style="--c:${last.color}" data-play="${last.id}">
      <div class="art">${esc(mono(last.title))}</div>
      <div><div class="t">${esc(last.title)}</div><div class="s">${SYSTEMS[last.system].label} · ${fmtAgo(last.lastPlayed)}${last.playSeconds ? " · " + fmtPlay(last.playSeconds) : ""}</div></div>
      <div class="play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></div>
    </button>` : "";

  if (!games.length) {
    $("#libWrap").innerHTML = `
      <div class="empty">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ffcb3d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><rect x="8" y="5" width="8" height="6" rx="1"/><path d="M9 16h2M10 15v2"/><circle cx="15" cy="15.5" r=".9"/><circle cx="13.5" cy="17" r=".9"/></svg>
        <h1>Your shelf is empty</h1>
        <p>Add your own ROM files: Emerald, FireRed, Black/White, Red and so on. Each game keeps its own save, and everything works offline.</p>
        <button class="btn primary" onclick="document.getElementById('fileIn').click()">Choose ROM files</button>
        <div class="drop-hint">Supports .gba · .gb · .gbc · .nds · .zip. You can also drag files onto this page.</div>
      </div>`;
    return;
  }
  $("#libWrap").innerHTML = `<h2 class="section">Library · ${games.length}</h2><div class="grid">` + games.map(g => `
    <div class="card" style="--c:${g.color}">
      <button class="cover" data-play="${g.id}" aria-label="Play ${esc(g.title)}">
        <span class="sys">${SYSTEMS[g.system].label}</span>
        <span class="mono">${esc(mono(g.title))}</span>
      </button>
      <div class="meta">
        <div class="txt"><div class="name">${esc(g.title)}</div><div class="sub">${fmtAgo(g.lastPlayed)}</div></div>
        <button class="more" data-more="${g.id}" aria-label="Options for ${esc(g.title)}">⋯</button>
      </div>
    </div>`).join("") + `</div>`;
}

document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-play]");
  if (p) { location.href = "play.html?id=" + encodeURIComponent(p.dataset.play); return; }
  const m = e.target.closest("[data-more]");
  if (m) openSheet(m.dataset.more);
});

// ---------- adding ROMs ----------
$("#addBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async (e) => { await addFiles([...e.target.files]); e.target.value = ""; };
async function addFiles(files) {
  let ok = 0; const errs = [];
  for (const f of files) {
    try { await importRomFile(f); ok++; } catch (err) { errs.push(err.message || String(err)); }
  }
  await render();
  if (ok) toast(`Added ${ok} game${ok > 1 ? "s" : ""}`);
  if (errs.length) setTimeout(() => toast(errs[0], 5000), ok ? 2700 : 0);
}
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); addFiles([...e.dataTransfer.files]); });

// ---------- per-game sheet ----------
function closeSheet() { $("#sheetBg").classList.remove("open"); }
$("#sheetBg").addEventListener("click", (e) => { if (e.target.id === "sheetBg") closeSheet(); });

async function openSheet(id) {
  const g = await Store.getGame(id);
  const save = await Store.getSave(id);
  const dsCore = g.system === "nds" ? `
    <div class="row"><div><div class="k">DS emulator core</div><div class="d">melonDS is more accurate. DeSmuME runs faster on weaker phones.</div></div>
      <select id="coreSel"><option value="melonds">melonDS</option><option value="desmume2015">DeSmuME</option></select></div>` : "";
  $("#sheet").innerHTML = `
    <h3>${esc(g.title)}</h3>
    <div class="sub">${SYSTEMS[g.system].label} · ${esc(g.fileName)} · ${fmtSize(g.size)}</div>
    <div class="row"><div style="flex:1"><div class="k" style="margin-bottom:6px">Name</div><input type="text" id="nameIn" value="${esc(g.title)}"></div></div>
    ${dsCore}
    <div class="row"><div><div class="k">In-game save</div><div class="d">${save ? "Last synced " + fmtAgo(save.updated) + " · " + fmtSize(save.data.byteLength) : "No save yet. Save in-game and it's stored here automatically."}</div></div></div>
    <div class="actions">
      <button class="btn primary full" data-act="play">▶ Play</button>
      <button class="btn ghost" data-act="export" ${save ? "" : "disabled style='opacity:.4'"}>Export save</button>
      <button class="btn ghost" data-act="import">Import save</button>
      <button class="btn danger full" data-act="delete">Remove game</button>
    </div>`;
  if (g.system === "nds") $("#coreSel").value = g.core;
  $("#sheetBg").classList.add("open");

  const persistEdits = async () => {
    const name = $("#nameIn").value.trim();
    if (name) g.title = name;
    if ($("#coreSel")) g.core = $("#coreSel").value;
    await Store.putGame(g);
  };
  $("#nameIn").onchange = async () => { await persistEdits(); render(); };
  if ($("#coreSel")) $("#coreSel").onchange = persistEdits;

  $("#sheet").onclick = async (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "play") { await persistEdits(); location.href = "play.html?id=" + encodeURIComponent(id); }
    if (act === "export" && save) {
      const ext = g.system === "nds" ? "dsv" : "sav";
      downloadBlob(new Blob([save.data]), `${g.title.replace(/[\\/:*?"<>|]/g, "")}.${ext}`);
    }
    if (act === "import") {
      const inp = $("#saveIn");
      inp.onchange = async () => {
        const f = inp.files[0]; inp.value = "";
        if (!f) return;
        let data = new Uint8Array(await f.arrayBuffer());
        // DeSmuME .dsv files carry a 122-byte footer; strip it for raw saves
        const idx = new TextDecoder("latin1").decode(data.subarray(Math.max(0, data.length - 256))).lastIndexOf("|<--Snip above here");
        if (idx >= 0) data = data.slice(0, Math.max(0, data.length - 256) + idx);
        await Store.putSave({ id, data, updated: Date.now(), pendingImport: true });
        closeSheet();
        toast("Save imported. It loads the next time you start this game.", 3500);
      };
      inp.click();
    }
    if (act === "delete") {
      if (e.target.dataset.confirm !== "1") {
        e.target.dataset.confirm = "1";
        e.target.textContent = "Tap again to remove the game and its save";
        return;
      }
      await Store.deleteGame(id);
      closeSheet(); render(); toast("Removed");
    }
  };
}

// ---------- offline status ----------
async function updateStatus() {
  let persisted = false;
  try { if (navigator.storage?.persist) persisted = await navigator.storage.persist(); } catch {}
  const reg = "serviceWorker" in navigator ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
  const ready = !!(reg && (reg.active || reg.waiting));
  $("#dot").classList.toggle("ok", ready);
  $("#statusText").textContent = ready ? (navigator.onLine ? "Offline ready" : "Offline") : "Preparing offline mode…";
  $("#status").title = persisted ? "Storage is protected from automatic cleanup" : "Install the app to keep saves safe from browser cleanup";
}
registerSW();
navigator.serviceWorker?.addEventListener("controllerchange", updateStatus);
navigator.serviceWorker?.ready.then(updateStatus);
addEventListener("online", updateStatus); addEventListener("offline", updateStatus);
updateStatus();
render();
</script>
</body>
</html>
